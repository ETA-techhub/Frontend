<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WeatherNow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="container">
      <h1 class="logo">WeatherNow</h1>
      <p class="tag">Accurate local forecasts, fast.</p>
    </div>
  </header>

  <main class="main">
    <div class="container card">
      <form id="searchForm" class="search">
        <input type="text" id="cityInput" placeholder="Enter city (e.g., London)" aria-label="City name" required />
        <button type="submit" id="searchBtn">Search</button>
      </form>

      <section id="weatherSection" class="weather hidden" aria-live="polite">
        <div class="top">
          <div class="city-info">
            <h2 id="cityName">—</h2>
            <p id="country">—</p>
          </div>
          <div class="icon-temp">
            <img id="weatherIcon" alt="weather icon" />
            <div class="temp">
              <span id="temperature">--°C</span>
              <small id="desc">—</small>
            </div>
          </div>
        </div>

        <div class="details">
          <div class="detail">
            <label>Humidity</label>
            <div id="humidity">--%</div>
          </div>
          <div class="detail">
            <label>Wind</label>
            <div id="wind">-- m/s</div>
          </div>
          <div class="detail">
            <label>Feels like</label>
            <div id="feelsLike">--°C</div>
          </div>
          <div class="detail">
            <label>Pressure</label>
            <div id="pressure">-- hPa</div>
          </div>
        </div>
      </section>

      <p id="errorMsg" class="error hidden" role="alert"></p>

      <footer class="note">
        <small>Data from OpenWeather (Free API) — Demo for frontend portfolio</small>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
